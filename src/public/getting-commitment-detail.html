<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detail Commitment - Educamp 2026</title>
  <link rel="icon" type="image/png" href="/images/Logo%20Educamp%202026.png" />

  <style>
    :root {
      --bg: #0b1329;
      --border: rgba(148, 163, 184, 0.25);
      --text: #e2e8f0;
      --accent-2: #38bdf8;
      --error: #ef4444;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(180deg, #0b1329 0%, #111827 100%);
      color: var(--text);
      padding: 32px 20px 60px;
    }

    .page-wrap {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
      width: 100%;
    }

    .brand-logo {
      width: min(480px, 80vw);
      max-height: 120px;
      object-fit: contain;
    }

    .back-btn {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: rgba(30, 41, 59, 0.8);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 20px;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .back-btn:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent-2);
      color: var(--white);
      transform: translateX(-3px);
    }

    .commitment-header-box {
      width: 100%;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid var(--accent-2);
      border-radius: 16px;
      padding: 16px 24px;
      text-align: center;
      font-size: clamp(16px, 2.5vw, 20px);
      font-weight: 700;
      color: var(--white);
      margin-bottom: 24px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    }

    .input-card {
      width: 100%;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.96), rgba(30, 41, 59, 0.9));
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
      margin-bottom: 28px;
    }

    .input-label {
      display: block;
      font-size: 18px;
      font-weight: 600;
      color: var(--white);
      margin-bottom: 12px;
    }

    .keyword-textarea {
      width: 100%;
      min-height: 180px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 12px;
      padding: 16px;
      color: var(--white);
      font-size: 16px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .keyword-textarea:focus {
      border-color: var(--accent-2);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    /* AREA TOMBOL SUBMIT DAN PESAN ERROR */
    .action-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .submit-btn {
      min-width: 200px;
      padding: 14px 36px;
      background: var(--accent-2);
      color: #0f172a;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.05em;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
    }

    .submit-btn:hover {
      background: #7dd3fc;
      transform: translateY(-2px);
    }

    .error-message {
      display: none;
      margin-top: 12px;
      color: var(--error);
      font-size: 15px;
      font-weight: 700;
      text-align: center;
    }

    @media (min-width: 650px) {
      .action-container {
        flex-direction: row;
        justify-content: center;
      }
      .error-message {
        position: absolute;
        right: 0;
        margin-top: 0;
      }
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    
    <header class="header">
      <img src="/images/Logo%20Educamp%202026_tagline_white.png" alt="Logo Educamp 2026" class="brand-logo" />
    </header>

    <button type="button" class="back-btn" onclick="window.location.href='getting-commitment.html'">
      &#8592; Kembali
    </button>

    <div id="commitment-title" class="commitment-header-box">
      Memuat data...
    </div>

    <main class="input-card">
      <label for="keyword-input" class="input-label">Ketik kata Kunci:</label>
      <textarea id="keyword-input" class="keyword-textarea" placeholder="Tuliskan kata kunci di sini..."></textarea>
    </main>

    <div class="action-container">
      <button type="button" class="submit-btn" id="btn-submit">SUBMIT</button>
      <div id="error-msg" class="error-message">Salah input : Kata kunci salah</div>
    </div>

  </div>

  <script>
    const STORAGE_KEY = 'educamp_getting_commitment';
    const BYPASS_KEYWORD = 'eduuucamp'; // Kata kunci bypass

    // Pemetaan Kata Kunci Berdasarkan ID
    const VALID_KEYWORDS = {
      'commitment-1': 'Automatic Change Over',
      'commitment-2': 'Green Factory',
      'commitment-3': 'Online / Virtual Learning',
      'commitment-4': 'Lean Manufacturing',
      'commitment-5': 'Lead Time Efficiency',
      'commitment-6': 'Quality Digital Transformation'
    };

    // Ambil Parameter URL
    const urlParams = new URLSearchParams(window.location.search);
    const commitmentId = urlParams.get('id');
    const titleValue = urlParams.get('title');

    const titleElement = document.getElementById('commitment-title');
    const inputArea = document.getElementById('keyword-input');
    const submitBtn = document.getElementById('btn-submit');
    const errorMsg = document.getElementById('error-msg');

    if (titleValue) {
      titleElement.textContent = titleValue;
    } else {
      titleElement.textContent = 'Judul Komitmen Tidak Ditemukan';
    }

    // Fungsi Validasi & Submit
    submitBtn.addEventListener('click', async function() {
      const userInput = inputArea.value.trim();
      const expectedKeyword = VALID_KEYWORDS[commitmentId];

      if (!userInput) {
        errorMsg.textContent = 'Harap isi kata kunci terlebih dahulu!';
        errorMsg.style.display = 'block';
        return;
      }

      // Cek apakah pengguna menggunakan kata kunci bypass
      const isBypass = userInput.toLowerCase() === BYPASS_KEYWORD.toLowerCase();
      // Nilai yang akan dikirim & disimpan (jika bypass, ganti dengan nilai asli)
      const keywordToSubmit = isBypass ? expectedKeyword : userInput;

      submitBtn.disabled = true;
      submitBtn.textContent = 'MEMPROSES...';

      try {
        const response = await fetch('/api/commitment/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            commitmentId,
            keyword: keywordToSubmit,
            submitter: 'PESERTA'
          })
        });

        const resData = await response.json();

        if (response.ok && resData.success) {
          errorMsg.style.display = 'none';

          // Backup ke localStorage sebagai local cache
          try {
            let savedData = {};
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) savedData = JSON.parse(raw);
            savedData[commitmentId] = expectedKeyword;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(savedData));
          } catch (e) {}

          window.location.href = 'getting-commitment.html';
        } else {
          errorMsg.textContent = resData.error || 'Salah input : Kata kunci salah';
          errorMsg.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'SUBMIT';
        }
      } catch (err) {
        // Fallback jika offline / server unreachable
        const isCorrect = keywordToSubmit.toLowerCase() === expectedKeyword.toLowerCase();
        if (expectedKeyword && isCorrect) {
          errorMsg.style.display = 'none';
          try {
            let savedData = {};
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) savedData = JSON.parse(raw);
            savedData[commitmentId] = expectedKeyword;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(savedData));
          } catch (e) {}
          window.location.href = 'getting-commitment.html';
        } else {
          errorMsg.textContent = 'Salah input : Kata kunci salah';
          errorMsg.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'SUBMIT';
        }
      }
    });

    // Sembunyikan error saat pengguna mulai mengetik kembali
    inputArea.addEventListener('input', function() {
      errorMsg.style.display = 'none';
    });
  </script>
</body>
</html>
